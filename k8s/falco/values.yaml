# Valeurs Helm de Falco pour le TP3 (chart falcosecurity/falco 9.2.2, Falco 0.45.2)
driver:
  # Pilote eBPF "CO-RE" : aucun module noyau a compiler. Seule option qui
  # fonctionne sur le noyau linuxkit de Docker Desktop (kind).
  kind: modern_ebpf
tty: true
falcosidekick:
  enabled: false
falco:
  json_output: false
  priority: notice

# Regles propres a VulnBank, en plus des regles officielles (falco_rules.yaml).
customRules:
  vulnbank-rules.yaml: |-
    - list: vulnbank_app_procs
      items: [gunicorn, python, python3, python3.13]

    # Processus du runtime qui PREPARENT le conteneur a sa creation (runc et le
    # hook OCI de kind lance par runc). Ils sont rattaches au conteneur par Falco
    # mais ne viennent pas de l'interieur : ce ne sont pas des intrusions.
    - macro: container_runtime_setup
      condition: >
        (proc.name startswith "runc" or proc.pname = runc
         or proc.pname startswith "runc:" or proc.aname startswith "runc:")

    - macro: vulnbank_container
      condition: (k8s.ns.name = "vulnbank" and container.name = "vulnbank")

    # Un attaquant qui obtient un shell essaie en general de lire les secrets
    # montes. Seul le processus applicatif a le droit de les lire.
    - rule: VulnBank secret read by unexpected process
      desc: Lecture d'un fichier du volume Secret par un autre processus que l'application
      condition: >
        open_read and vulnbank_container
        and fd.name startswith /run/secrets/vulnbank
        and not proc.name in (vulnbank_app_procs)
        and not container_runtime_setup
      output: >
        Secret VulnBank lu par un processus inattendu
        (file=%fd.name process=%proc.name cmdline=%proc.cmdline user_uid=%user.uid
        pod=%k8s.pod.name ns=%k8s.ns.name image=%container.image.repository:%container.image.tag)
      priority: CRITICAL
      tags: [vulnbank, secrets, mitre_credential_access, T1552]

    # L'image de production n'a besoin d'aucun outil reseau ni de shell.
    - rule: VulnBank unexpected process in production container
      desc: Processus hors liste blanche lance dans le conteneur VulnBank
      condition: >
        spawned_process and vulnbank_container
        and not proc.name in (vulnbank_app_procs)
        and not container_runtime_setup
      output: >
        Processus inattendu dans VulnBank
        (process=%proc.name cmdline=%proc.cmdline parent=%proc.pname user_uid=%user.uid
        terminal=%proc.tty pod=%k8s.pod.name ns=%k8s.ns.name)
      priority: WARNING
      tags: [vulnbank, process, mitre_execution]
