# MODELE UNIQUEMENT - ne jamais commiter de vraies valeurs.
# Le vrai Secret est cree par scripts/create-secret.sh avec des valeurs
# aleatoires (kubectl create secret ... --from-file), sans passer par Git.
apiVersion: v1
kind: Secret
metadata:
  name: vulnbank-secrets
  namespace: vulnbank
type: Opaque
stringData:
  secret_key: "<64 caracteres hexadecimaux aleatoires>"
  admin_password: "<mot de passe administrateur fort>"
  rates_api_key: "<cle d'acces de l'API exchangerate.host>"
