apiVersion: v1
kind: Namespace
metadata:
  name: vulnbank
  labels:
    # Pod Security Admission : profil "restricted" IMPOSE (enforce). Un pod root,
    # privilegie ou avec des capacites en trop est refuse a l'admission.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
